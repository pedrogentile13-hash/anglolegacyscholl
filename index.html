    <script>
        function setLanguage(lang) {
            const elements = document.querySelectorAll('[data-pt][data-en]');

            elements.forEach(element => {
                if (lang === 'pt') {
                    element.textContent = element.getAttribute('data-pt');
                } else if (lang === 'en') {
                    element.textContent = element.getAttribute('data-en');
                }
            });

            document.getElementById('lang-pt').classList.toggle('bg-blue-600');
            document.getElementById('lang-pt').classList.toggle('text-white');
            document.getElementById('lang-pt').classList.toggle('text-gray-600');

            document.getElementById('lang-en').classList.toggle('text-gray-600');
            document.getElementById('lang-en').classList.toggle('text-gray-900');
            document.getElementById('lang-en').classList.toggle('bg-blue-600');
            document.getElementById('lang-en').classList.toggle('text-white');

            localStorage.setItem('language', lang);
            document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
        }

        document.getElementById('lang-pt').addEventListener('click', () => setLanguage('pt'));
        document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));

        const savedLanguage = localStorage.getItem('language') || 'pt';
        setLanguage(savedLanguage);

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
