    <!-- JavaScript para Sistema Bilíngue -->
    <script>
        // Função para atualizar idioma
        function setLanguage(lang) {
            const elements = document.querySelectorAll('[data-pt][data-en]');

            elements.forEach(element => {
                if (lang === 'pt') {
                    element.textContent = element.getAttribute('data-pt');
                } else if (lang === 'en') {
                    element.textContent = element.getAttribute('data-en');
                }
            });

            // Atualizar botões de idioma
            document.getElementById('lang-pt').classList.toggle('bg-blue-600');
            document.getElementById('lang-pt').classList.toggle('text-white');
            document.getElementById('lang-pt').classList.toggle('text-gray-600');

            document.getElementById('lang-en').classList.toggle('text-gray-600');
            document.getElementById('lang-en').classList.toggle('text-gray-900');
            document.getElementById('lang-en').classList.toggle('bg-blue-600');
            document.getElementById('lang-en').classList.toggle('text-white');

            // Salvar preferência no localStorage
            localStorage.setItem('language', lang);

            // Atualizar html lang attribute
            document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
        }

        // Configurar event listeners dos botões de idioma
        document.getElementById('lang-pt').addEventListener('click', () => setLanguage('pt'));
        document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));

        // Carregar idioma salvo ou português por padrão
        const savedLanguage = localStorage.getItem('language') || 'pt';
        setLanguage(savedLanguage);

        // Smooth scroll para links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Animação ao entrar em viewport (Intersection Observer)
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-fade-in');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Observar cards
        document.querySelectorAll('.card-hover').forEach(card => {
            card.classList.add('opacity-0');
            observer.observe(card);
        });
    </script>
